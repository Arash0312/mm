<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8" />
<title>پیدا کردن موقعیت با شماره موبایل</title>
<style>
  body { font-family: Tahoma, sans-serif; padding: 20px; background: #f0f0f0; }
  label, input, button { font-size: 16px; margin: 5px 0; }
  #result { margin-top: 15px; white-space: pre-line; background: #fff; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
<h2>پیدا کردن موقعیت مکانی</h2>

<label for="phone">شماره موبایل:</label><br />
<input type="text" id="phone" placeholder="09351977060" /><br />
<button onclick="findLocation()">پیدا کن</button>

<p id="result"></p>

<script>
function findLocation() {
  const phone = document.getElementById('phone').value.trim();
  if (!phone.match(/^09\d{9}$/)) {
    document.getElementById('result').textContent = 'شماره موبایل معتبر نیست!';
    return;
  }

  if (!navigator.geolocation) {
    document.getElementById('result').textContent = 'GPS در این مرورگر پشتیبانی نمی‌شود.';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      document.getElementById('result').textContent =
        `شماره: ${phone}\nمختصات:\nعرض جغرافیایی: ${lat}\nطول جغرافیایی: ${lon}`;
    },
    (error) => {
      document.getElementById('result').textContent = 'امکان دسترسی به موقعیت مکانی وجود ندارد.';
    }
  );
}
</script>
</body>
</html>
