<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Image Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #d4edda; /* سبز خاص برای پس‌زمینه */
            color: #155724; /* رنگ متن متناسب */
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #c3e6cb; /* سبز روشن برای هدر */
            border-bottom: 2px solid #155724; /* خط زیرین هدر */
        }
        .header button {
            background-color: #28a745; /* سبز خاص برای دکمه */
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .header button:hover {
            background-color: #218838; /* سبز تیره‌تر برای حالت هاور */
        }
        img {
            max-width: 90%;
            height: auto;
            margin-top: 20px;
            border: 5px solid #c3e6cb; /* قاب سبز برای تصویر */
            border-radius: 10px;
        }
        .image-name {
            margin: 20px 0;
            font-size: 20px;
            font-weight: bold;
            color: #155724; /* سبز متناسب با متن */
        }
        .last-update {
            margin-top: 30px;
            font-size: 16px;
            color: #6c757d; /* رنگ خاکی برای تاریخ آخرین بروز رسانی */
        }
    </style>
</head>
<body>

    <div class="header">
        <button onclick="history.back()">Go Back</button>
        <h1>Futures Signal</h1>
    </div>

    <div>
        <!-- Replace 'image.jpg' with the actual name of your image file -->
        <img src="Picsart_25-01-04_21-24-29-611.jpg" alt="Image">
        <div class="image-name">PepeUsdt</div>
    </div>

    <!-- ساعت آخرین بروز رسانی -->
    <div class="last-update">
        آخرین بروز رسانی: <span id="last-update-time"></span>
    </div>

    <script>
        // زمان بروز رسانی را به صورت اتوماتیک نمایش می‌دهیم
        function updateLastUpdateTime() {
            const now = new Date();

            // تنظیم زمان به وقت ایران (UTC+3:30)
            const iranOffset = 3.5 * 60; // 3 ساعت و 30 دقیقه (در دقیقه)
            const localTime = new Date(now.getTime() + iranOffset * 60 * 1000); // تبدیل به زمان ایران

            const hours = localTime.getHours().toString().padStart(2, '0');
            const minutes = localTime.getMinutes().toString().padStart(2, '0');
            const seconds = localTime.getSeconds().toString().padStart(2, '0');
            const date = `${localTime.getFullYear()}-${(localTime.getMonth() + 1).toString().padStart(2, '0')}-${localTime.getDate().toString().padStart(2, '0')}`;
            const time = `${hours}:${minutes}:${seconds}`;

            document.getElementById("last-update-time").textContent = `${date} ${time}`;
        }

        // فراخوانی تابع برای نمایش زمان بروز رسانی
        updateLastUpdateTime();
    </script>

</body>
</html>
