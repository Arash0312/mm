<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Image Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #d4edda; /* Light green background */
            color: #155724; /* Matching text color */
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #c3e6cb; /* Light green for header */
            border-bottom: 2px solid #155724; /* Header underline */
        }
        .header button {
            background-color: #28a745; /* Green button */
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .header button:hover {
            background-color: #218838; /* Darker green on hover */
        }
        img {
            max-width: 90%;
            height: auto;
            margin-top: 20px;
            border: 5px solid #c3e6cb; /* Green border for image */
            border-radius: 10px;
        }
        .image-name {
            margin: 20px 0;
            font-size: 20px;
            font-weight: bold;
            color: #155724; /* Matching green text */
        }
        .last-update, .current-time {
            margin-top: 30px;
            font-size: 16px;
            color: #6c757d; /* Gray color for updates */
        }
    </style>
</head>
<body>

    <div class="header">
        <button onclick="history.back()">Go Back</button>
        <h1>Futures Signal</h1>
    </div>

    <div>
        <!-- Replace 'image.jpg' with the actual name of your image file -->
        <img src="Picsart_25-01-04_21-24-29-611.jpg" alt="Image">
        <div class="image-name">pepe usdt</div>
    </div>

    <!-- Site creation time -->
    <div class="last-update">
        Site created on: <span id="site-create-time"></span>
    </div>

    <!-- Live clock -->
    <div class="current-time">
        Current Time (Tehran): <span id="current-time"></span>
    </div>

    <script>
        // Define the site's creation date and time (example: 2025-01-04T12:00:00)
        const siteCreateDate = new Date('2025-01-04T12:00:00Z'); // UTC format

        // Convert UTC to Tehran time (UTC+3:30)
        function convertToIranTime(date) {
            const iranOffset = 3.5 * 60; // Tehran time offset in minutes (UTC+3:30)
            return new Date(date.getTime() + iranOffset * 60 * 1000); // Convert to Tehran time
        }

        // Format date and time to Tehran time
        function formatDateToIranTime(date) {
            const iranTime = convertToIranTime(date);

            const hours = iranTime.getHours().toString().padStart(2, '0');
            const minutes = iranTime.getMinutes().toString().padStart(2, '0');
            const seconds = iranTime.getSeconds().toString().padStart(2, '0');
            const dateString = `${iranTime.getFullYear()}-${(iranTime.getMonth() + 1).toString().padStart(2, '0')}-${iranTime.getDate().toString().padStart(2, '0')}`;
            const timeString = `${hours}:${minutes}:${seconds}`;

            return `${dateString} ${timeString}`;
        }

        // Display site creation time
        document.getElementById("site-create-time").textContent = formatDateToIranTime(siteCreateDate);

        // Update and display the live clock
        function updateCurrentTime() {
            const now = new Date();
            const iranTime = convertToIranTime(now);

            const hours = iranTime.getHours().toString().padStart(2, '0');
            const minutes = iranTime.getMinutes().toString().padStart(2, '0');
            const seconds = iranTime.getSeconds().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}:${seconds}`;

            document.getElementById("current-time").textContent = timeString;
        }

        // Update the live clock every second
        setInterval(updateCurrentTime, 1000);

        // Initial clock update
        updateCurrentTime();
    </script>

</body>
</html>
